<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Counter</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <div class="home">
            <h1 class="home">HOME</h1>
            <h1 class="h-score" id="score-home">0</h1>
                <div class="plus">
                  <button type="button" class="score-btn" data-team="home" data-points="1">+1</button>
                  <button type="button" class="score-btn" data-team="home" data-points="2">+2</button>
                  <button type="button" class="score-btn" data-team="home" data-points="3">+3</button>
                  
           
        </div>
        </div>
            <div>
                <h1 class="guest" >GUEST</h1>
                 <h1 class="g-score" id="score-guest">0</h1>
                 
              <div class="plus">
                 <button type="button" class="score-btn" data-team="guest" data-points="1">+1</button>
                  <button type="button" class="score-btn" data-team="guest" data-points="2">+2</button>
                  <button type="button" class="score-btn" data-team="guest" data-points="3">+3</button>
        </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
